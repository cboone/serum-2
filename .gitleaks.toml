[extend]
# Use the default gitleaks rules as a base.
useDefault = true

[allowlist]
# There are no vendored dependencies, and no Python package lockfile: each
# tool declares its own dependencies inline via PEP 723, and tools/*.py.lock
# holds only package hashes. package-lock.json pins the text linters and is
# scanned like any other file.
#
# The wavetables and the fixture presets and curves are generated binary
# files: 32-bit float audio and zstd-compressed CBOR. High-entropy byte runs
# are expected there and mean nothing, so they are excluded to avoid false
# positives.
paths = [
  '''serum/Tables/.*\.wav''',
  '''tests/scrut/fixtures/serum/.*\.(SerumPreset|XferShape)''',
]
