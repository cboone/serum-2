# Markdown and formatting checks.
#
# This is a separate workflow from ci.yml on purpose. ci.yml ignores "*.md" and
# "docs/**", which is right for the code jobs but would stop these checks from
# running on the changes they exist to check, so this workflow has no paths
# filter.
#
# use-consumer-versions installs markdownlint-cli2 and Prettier from this
# repository's package-lock.json, the same versions `make text-lint` runs.

name: Text lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  text-lint:
    name: Text lint
    uses: cboone/gh-actions/.github/workflows/lint-text.yml@3c9adb5a8b166444d3c0e3fe606d55f0dc7ac726 # v5.0.0
    with:
      use-consumer-versions: true
